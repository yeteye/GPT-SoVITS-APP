<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPT-SoVITS - 在线语音克隆平台</title>
  <meta name="description" content="GPT-SoVITS在线语音克隆平台，支持文本转语音、音色克隆等功能">
  <style>
    /* 加载动画 */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .loading-content {
      text-align: center;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 18px;
      font-weight: 500;
    }

    /* 确保app容器能正常显示 */
    #app {
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <!-- 加载动画 -->
  <div id="loading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">正在加载 GPT-SoVITS...</div>
    </div>
  </div>

  <!-- Vue应用容器 -->
  <div id="app"></div>

  <script>
    // 应用加载完成后隐藏loading
    window.addEventListener('load', function () {
      setTimeout(function () {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          loading.style.transition = 'opacity 0.5s ease';
          setTimeout(() => {
            loading.style.display = 'none';
          }, 500);
        }
      }, 1000);
    });

    // 改进的错误处理 - 过滤掉空错误
    window.addEventListener('error', function (e) {
      // 过滤掉空错误
      if (!e.error) {
        console.warn('捕获到空的 JavaScript 错误，已忽略');
        return;
      }

      // 只处理有意义的错误
      if (e.error.message) {
        console.error('JavaScript错误:', e.error);

        const loading = document.getElementById('loading');
        if (loading) {
          loading.innerHTML = `
            <div class="loading-content">
              <div style="font-size: 24px; margin-bottom: 16px;">⚠️</div>
              <div class="loading-text">应用加载失败</div>
              <div style="margin-top: 16px; font-size: 14px; opacity: 0.8;">
                请刷新页面重试，或检查控制台错误信息
              </div>
            </div>
          `;
        }
      }
    });

    // 处理未捕获的 Promise rejection - 过滤空错误
    window.addEventListener('unhandledrejection', function (e) {
      // 过滤掉 null 或 undefined 的 rejection
      if (e.reason === null || e.reason === undefined) {
        console.warn('捕获到空的 Promise rejection，已忽略');
        e.preventDefault(); // 阻止默认的控制台错误输出
        return;
      }

      // 只处理有意义的错误
      if (e.reason && (e.reason.message || typeof e.reason === 'string')) {
        console.error('未捕获的 Promise 错误:', e.reason);
      } else {
        console.warn('捕获到无效的 Promise rejection:', e.reason);
        e.preventDefault(); // 阻止默认的控制台错误输出
      }
    });
  </script>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
